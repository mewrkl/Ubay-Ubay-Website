<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff page, Ubay-Ubay</title>
  <!-- Private page for Ubay-Ubay staff, reached from "Staff login" in the footer.
       Hidden from search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- EDIT: When you change styles.css or script.js, raise the ?v= number here AND on the other pages. -->
  <link rel="stylesheet" href="styles.css?v=61">
  <script src="script.js?v=28" defer></script>
  <script src="admin.js?v=2" defer></script>
</head>
<body class="staff">

<!--
  HOW THIS PAGE WORKS
  - Staff log in with their name and the staff password. The password is checked by the
    Apps Script (ADMIN_PASSWORD in its settings), never stored in this page.
  - Accept sends the welcome email with the artist's private upload link.
    Decline sends a kind "not this time" email. Both are logged with the staff name.
  - admin.js builds the list. Setup and use: README.md, "Use the staff page".
-->

<header class="staff-top">
  <a class="staff-brand" href="index.html" aria-label="Ubay-Ubay website">
    <img src="assets/brand/logo-horizontal-cream.png" width="160" height="57" alt="Ubay-Ubay">
  </a>
  <span class="staff-top-label">Staff</span>
  <div class="staff-top-user" id="staff-top-user" hidden>
    <span class="staff-top-name">Logged in as <strong id="staff-shown"></strong></span>
    <button class="staff-top-button" type="button" id="refresh-button">Refresh</button>
    <button class="staff-top-button" type="button" id="logout-button">Log out</button>
  </div>
</header>

<main class="staff-main">

  <!-- Log in -->
  <section class="staff-login" id="login-box" hidden aria-labelledby="login-title">
    <h1 id="login-title" class="staff-login-title">Staff login</h1>
    <p class="small">For Ubay-Ubay staff. Artists don't need to log in.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field">
        <label for="staff-name">Your name</label>
        <p class="hint" id="staff-name-hint">Shown next to every accept, decline, and change you make.</p>
        <input id="staff-name" type="text" autocomplete="name" maxlength="60" aria-describedby="staff-name-hint" required>
      </div>
      <div class="field">
        <label for="staff-password">Staff password</label>
        <input id="staff-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button-primary button-block" type="submit" id="login-button">Log in</button>
      <p class="small form-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <p class="small staff-login-back"><a href="index.html">← Back to the website</a></p>
  </section>

  <!-- The dashboard -->
  <div id="admin-app" hidden>
    <h1 class="staff-title" id="page-title">Sign-ups</h1>

    <!-- The 4 count tiles are also the filters -->
    <div class="stat-tiles" role="group" aria-label="Show">
      <button class="stat-tile" type="button" data-filter="needs" aria-pressed="true">
        <span class="stat-label">Needs a reply</span>
        <span class="stat-value" id="count-needs">0</span>
        <span class="stat-note" id="note-needs"></span>
      </button>
      <button class="stat-tile" type="button" data-filter="Accepted" aria-pressed="false">
        <span class="stat-label">Accepted</span>
        <span class="stat-value" id="count-accepted">0</span>
        <span class="stat-note">In the program</span>
      </button>
      <button class="stat-tile" type="button" data-filter="Declined" aria-pressed="false">
        <span class="stat-label">Declined</span>
        <span class="stat-value" id="count-declined">0</span>
        <span class="stat-note">Told "not this time"</span>
      </button>
      <button class="stat-tile" type="button" data-filter="uploads" aria-pressed="false">
        <span class="stat-label">Uploaded this month</span>
        <span class="stat-value" id="count-uploads">0</span>
        <span class="stat-note" id="note-uploads">Artists</span>
      </button>
    </div>

    <div class="staff-tools">
      <label class="staff-search">
        <span class="visually-hidden">Search</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
        <input type="search" id="staff-search" placeholder="Search name, artist name, or email" autocomplete="off">
      </label>
      <button class="button button-ghost button-small" type="button" id="show-all">Show everyone</button>
      <p class="small staff-showing" id="staff-showing" aria-live="polite"></p>
    </div>

    <p class="small form-status admin-status" id="admin-status" role="status" aria-live="polite"></p>

    <div class="srows" id="staff-list">
      <!-- Column titles, computers only. Each row below is a button that opens its details. -->
    </div>
  </div>

</main>

<!-- Asks before an email goes out -->
<dialog class="example-dialog thanks-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="example-dialog-inner">
    <div class="example-dialog-head">
      <p class="example-dialog-title" id="confirm-title"></p>
    </div>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="button button-secondary" type="button" data-answer="no">Cancel</button>
      <button class="button button-primary" type="button" data-answer="yes" id="confirm-yes">Send email</button>
    </div>
  </div>
</dialog>

<!-- One design, full size -->
<dialog class="example-dialog" id="image-dialog" aria-labelledby="image-title">
  <div class="example-dialog-inner">
    <div class="example-dialog-head">
      <p class="example-dialog-title" id="image-title"></p>
      <form method="dialog">
        <button class="example-dialog-close" type="submit" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path>
          </svg>
        </button>
      </form>
    </div>
    <div id="image-full"></div>
  </div>
</dialog>

</body>
</html>
